<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Header</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light dark;
            --bg: rgba(255, 255, 255, 0.85);
            --text: #0f172a;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --shadow: 0 20px 45px rgba(15, 23, 42, 0.18);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #dbeafe 0%, #e9d5ff 100%);
            color: var(--text);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
        }

        header {
            width: min(960px, 100%);
            background: var(--bg);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 1rem 1.5rem;
        }

        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 600;
            font-size: 1.1rem;
            color: inherit;
            text-decoration: none;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            font-size: 1.35rem;
            font-weight: 600;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        nav a {
            font-size: 0.95rem;
            text-decoration: none;
            color: inherit;
            font-weight: 500;
            position: relative;
            padding: 0.25rem 0;
        }

        nav a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -0.3rem;
            width: 100%;
            height: 2px;
            background: var(--accent);
            border-radius: 999px;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }

        nav a:hover::after,
        nav a:focus-visible::after {
            transform: scaleX(1);
        }

        .cta-button {
            padding: 0.65rem 1.4rem;
            border-radius: 999px;
            border: none;
            background: linear-gradient(135deg, var(--accent), #7c3aed);
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
        }

        .cta-button:hover,
        .cta-button:focus-visible {
            transform: translateY(-1px);
            box-shadow: 0 14px 28px rgba(37, 99, 235, 0.35);
        }

        .menu-toggle {
            display: none;
            border: none;
            background: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: inherit;
        }

        @media (max-width: 720px) {
            nav,
            .cta-button {
                display: none;
            }

            .menu-toggle {
                display: inline-flex;
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 0.75rem 1rem;
            }

            .brand-logo {
                width: 40px;
                height: 40px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="nav">
            <a href="#" class="brand" aria-label="Aurora UI home">
                <span class="brand-logo">A</span>
                <span>Aurora UI</span>
            </a>
            <nav aria-label="Primary navigation">
                <a href="#features">Features</a>
                <a href="#pricing">Pricing</a>
            </nav>
            <button class="cta-button" type="button">Get Started</button>
            <button class="menu-toggle" type="button" aria-label="Open menu">☰</button>
        </div>
    </header>
</body>
</html>
