<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Megamenu Item Example</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f5f5f8;
        padding: 2rem;
        display: flex;
        justify-content: center;
      }

      .megamenuitem {
        width: 20vw;
        min-width: 240px;
        display: flex;
        align-items: center;
        gap: 1rem;
        background: #ffffff;
        border-radius: 16px;
        border: 1px solid rgba(0, 0, 0, 0.08);
        padding: 1rem;
        text-decoration: none;
        color: #1f1f24;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
        transition: box-shadow 0.2s ease, transform 0.2s ease;
      }

      .megamenuitem:hover,
      .megamenuitem:focus-visible {
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
        transform: translateY(-2px);
      }

      .megamenuitem__icon {
        flex-shrink: 0;
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: #f1f1f5;
        display: grid;
        place-items: center;
      }

      .megamenuitem__text {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
      }

      .megamenuitem__title {
        font-size: 1rem;
        font-weight: 600;
        margin: 0;
      }

      .megamenuitem__subtitle {
        font-size: 0.9rem;
        color: #5f6673;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <a class="megamenuitem" href="#">
      <span class="megamenuitem__icon" aria-hidden="true">
        <svg
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12Z"
            stroke="#111827"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M19 22C19 18.6863 15.866 16 12 16C8.13401 16 5 18.6863 5 22"
            stroke="#111827"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
      <span class="megamenuitem__text">
        <span class="megamenuitem__title">About Us</span>
        <span class="megamenuitem__subtitle">Get to know PalataSystems</span>
      </span>
    </a>
  </body>
</html>
